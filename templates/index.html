<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OCR PDF</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:560px;margin:2rem auto;padding:0 1rem;color:#222}
  h1{font-size:1.4rem}
  #drop{border:2px dashed #888;border-radius:10px;padding:2rem;text-align:center;cursor:pointer}
  #drop.on{background:#eef6ff;border-color:#2b7cff}
  fieldset{border:1px solid #ccc;border-radius:8px;margin:1rem 0}
  label{display:block;margin:.3rem 0}
  button{background:#2b7cff;color:#fff;border:0;border-radius:8px;padding:.7rem 1.2rem;font-size:1rem;cursor:pointer}
  button:disabled{opacity:.5}
  #msg{margin-top:1rem}.err{color:#c00}.ok{color:#080}
</style>
</head>
<body>
<h1>Ubah PDF Scan menjadi PDF Berteks (OCR)</h1>
<div id="drop">Klik atau seret file PDF ke sini<br><small id="nama"></small></div>
<input type="file" id="file" accept="application/pdf" hidden>
<fieldset><legend>Bahasa dokumen</legend>
  {% for kode, nama in bahasa %}
  <label><input type="checkbox" name="lang" value="{{kode}}" {{ 'checked' if kode=='ind' }}> {{nama}}</label>
  {% endfor %}
</fieldset>
<fieldset><legend>Mode</legend>
  <label><input type="radio" name="mode" value="skip" checked> Lewati halaman yang sudah berteks</label>
  <label><input type="radio" name="mode" value="force"> Paksa OCR ulang semua halaman</label>
  <label><input type="radio" name="mode" value="redo"> Ganti teks lama (OCR sebelumnya jelek)</label>
</fieldset>
<button id="go" disabled>Proses OCR</button>
<div id="msg"></div>
<script>
const $=s=>document.querySelector(s);let file=null;
const drop=$('#drop'),inp=$('#file');
function pick(f){file=f;$('#nama').textContent=f?f.name:'';$('#go').disabled=!f}
drop.onclick=()=>inp.click();inp.onchange=()=>pick(inp.files[0]);
drop.ondragover=e=>{e.preventDefault();drop.classList.add('on')};
drop.ondragleave=()=>drop.classList.remove('on');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('on');pick(e.dataTransfer.files[0])};
$('#go').onclick=async()=>{
  const fd=new FormData();fd.append('pdf',file);
  document.querySelectorAll('[name=lang]:checked').forEach(c=>fd.append('lang',c.value));
  fd.append('mode',document.querySelector('[name=mode]:checked').value);
  $('#go').disabled=true;$('#msg').className='';$('#msg').textContent='Memproses… (dokumen besar bisa beberapa menit)';
  try{
    const r=await fetch('/ocr',{method:'POST',body:fd});
    if(!r.ok){throw new Error((await r.json()).error)}
    const b=await r.blob(),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download=file.name.replace(/\.pdf$/i,'')+'_ocr.pdf';a.click();
    $('#msg').className='ok';$('#msg').textContent='Selesai. File diunduh.';
  }catch(e){$('#msg').className='err';$('#msg').textContent=e.message}
  $('#go').disabled=false;
};
</script>
</body>
</html>
